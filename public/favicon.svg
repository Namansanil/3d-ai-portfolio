<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek dark badge with glowing gradient stroke -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)" stroke="url(#nsGrad)" stroke-width="4" />
  
  <!-- Subtle glowing dot top right -->
  <circle cx="78" cy="22" r="4" fill="#06b6d4" />
  
  <!-- Monogram NS -->
  <g filter="url(#glow)">
    <!-- N -->
    <path d="M 23 68 L 23 32 L 30 32 L 44 55 L 44 32 L 50 32 L 50 68 L 43 68 L 29 45 L 29 68 Z" fill="url(#nsGrad)" />
    <!-- S -->
    <path d="M 57 60 C 57 65 61 68 67 68 C 73 68 77 65 77 60 C 77 54 71 52 64 50 C 57 48 53 45 53 39 C 53 34 58 31 65 31 C 72 31 76 35 76 40 L 70 40 C 70 37 68 35 65 35 C 61 35 59 37 59 39 C 59 42 62 44 68 46 C 75 48 83 50 83 59 C 83 66 77 72 67 72 C 57 72 51 66 51 59 Z" fill="url(#nsGrad)" />
  </g>
</svg>
